<title>Turn Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: calm front-desk console. White canvas, ink type, one accent for the primary action.
   Top nav (hairline) → two columns: customers (cards, 16px apart) | turn line (sticky card). 8px spacing grid, 48px touch targets. */
:root {
  --canvas: #ffffff;
  --soft: #f7f7f7;
  --strong: #f0f0f0;
  --hair: #dddddd;
  --hair-soft: #ebebeb;
  --ink: #222222;
  --body: #3f3f3f;
  --muted: #6a6a6a;
  --accent: #d6345a;        /* polish red: Assign, the one hot action */
  --accent-press: #b81f45;
  --on-accent: #ffffff;
  --enh: #7357d9; --pedi: #0e8a8c;
  --ok: #138a43; --warn: #b26a00; --crit: #c13515;
  --float: rgba(0,0,0,.02) 0 0 0 1px, rgba(0,0,0,.04) 0 2px 6px 0, rgba(0,0,0,.1) 0 4px 8px 0;
  --scrim: rgba(0,0,0,.5);
  --f: "Figtree", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --r-sm: 8px; --r-md: 14px; --r-lg: 20px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --canvas: #161616; --soft: #1f1f1f; --strong: #2a2a2a; --hair: #363636; --hair-soft: #2b2b2b;
  --ink: #f2f2f2; --body: #d6d6d6; --muted: #a3a3a3;
  --accent: #ff5577; --accent-press: #ff7590; --on-accent: #1a0a10;
  --enh: #a18cf5; --pedi: #3fc2c4; --ok: #4fd18a; --warn: #f2b84b; --crit: #ff7a5c;
  --float: rgba(255,255,255,.06) 0 0 0 1px, rgba(0,0,0,.5) 0 4px 12px 0; --scrim: rgba(0,0,0,.6);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --canvas: #161616; --soft: #1f1f1f; --strong: #2a2a2a; --hair: #363636; --hair-soft: #2b2b2b;
  --ink: #f2f2f2; --body: #d6d6d6; --muted: #a3a3a3;
  --accent: #ff5577; --accent-press: #ff7590; --on-accent: #1a0a10;
  --enh: #a18cf5; --pedi: #3fc2c4; --ok: #4fd18a; --warn: #f2b84b; --crit: #ff7a5c;
  --float: rgba(255,255,255,.06) 0 0 0 1px, rgba(0,0,0,.5) 0 4px 12px 0; --scrim: rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--canvas); color: var(--ink); font-family: var(--f); font-size: 15px; line-height: 1.43; padding-inline: 24px; padding-block: 0 32px; }
@media (max-width: 600px) { body { padding-inline: 16px; } }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* Top nav */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; min-height: 80px; padding-block: 12px; border-bottom: 1px solid var(--hair); margin-inline: -24px; padding-inline: 24px; margin-bottom: 32px; }
@media (max-width: 600px) { .top { margin-inline: -16px; padding-inline: 16px; } }
.brand { display: flex; align-items: center; gap: 12px; }
.brand h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -.2px; }
.brand .mark { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.brand .clock { color: var(--muted); font-size: 14px; }
.tag { font-size: 12px; color: var(--muted); }
.counts { display: flex; gap: 24px; flex-wrap: wrap; align-items: baseline; }
.count { display: flex; align-items: baseline; gap: 6px; color: var(--muted); font-size: 14px; }
.count b { color: var(--ink); font-size: 18px; font-weight: 600; }
button.count { text-decoration: underline; text-decoration-color: var(--hair); text-underline-offset: 4px; }
button.count:hover { text-decoration-color: var(--ink); }
.top .grow { flex: 1 1 0; }
.search { display: flex; align-items: center; gap: 10px; background: var(--canvas); border: 1px solid var(--hair); border-radius: 999px; padding: 0 20px; min-height: 48px; flex: 1 1 220px; max-width: 320px; box-shadow: var(--float); }
.search span { color: var(--muted); }
.search input { border: 0; background: transparent; color: var(--ink); font: inherit; width: 100%; min-height: 46px; outline: none; }
.btn { min-height: 48px; padding: 0 20px; border-radius: var(--r-sm); border: 1px solid var(--ink); background: var(--canvas); color: var(--ink); font-weight: 500; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: var(--soft); }
.btn.primary { background: var(--ink); color: var(--canvas); }
.btn.primary:hover { background: var(--body); }
.btn.ghost { border-color: transparent; text-decoration: underline; text-underline-offset: 3px; padding: 0 8px; }
.btn.ghost:hover { background: transparent; }
.btn.small { min-height: 40px; padding: 0 14px; font-size: 14px; border-color: var(--hair); }
.btn.small:hover { border-color: var(--ink); background: var(--canvas); }
.btn[disabled] { opacity: .35; cursor: not-allowed; }

/* Banner */
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; background: var(--soft); border-radius: var(--r-md); padding: 16px 20px; margin-bottom: 32px; }
.banner::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; }
.banner p { margin: 0; flex: 1 1 280px; color: var(--body); }

/* Main grid */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 40px; align-items: start; max-width: 1440px; }
@media (max-width: 1080px) { .main { grid-template-columns: minmax(0, 1fr); gap: 32px; } }
.panel-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 0 16px; }
.panel-h h2 { font-size: 22px; font-weight: 600; letter-spacing: -.3px; margin: 0; }
.panel-h .hint { color: var(--muted); font-size: 14px; }

/* Customer cards */
.list { display: grid; gap: 16px; }
.section-label { font-size: 16px; font-weight: 600; margin: 24px 0 0; display: flex; gap: 8px; align-items: baseline; }
.section-label span { color: var(--muted); font-weight: 400; }
.section-label:first-child { margin-top: 0; }
.card { background: var(--canvas); border: 1px solid var(--hair); border-radius: var(--r-md); padding: 20px 24px; display: grid; gap: 12px; }
.card.busy { padding: 14px 24px; gap: 8px; background: var(--soft); border-color: var(--hair-soft); }
.card.busy .line { padding-block: 6px; }
.card.busy .name { font-weight: 500; }
.filters button { min-height: 40px; }
.filters button span { color: inherit; opacity: .6; margin-left: 4px; }
.card-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.card-h .name { font-weight: 600; font-size: 17px; }
.card-h .meta { color: var(--muted); font-size: 14px; }
.wait { font-size: 14px; color: var(--muted); margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
.wait.warn { color: var(--warn); font-weight: 600; }
.wait.crit { color: var(--crit); font-weight: 600; }
.wait.warn::before, .wait.crit::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.note { font-size: 14px; color: var(--muted); }
.lines { display: grid; }
.line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding-block: 12px; border-top: 1px solid var(--hair-soft); }
.line:first-child { border-top: 0; padding-top: 0; }
.line:last-child { padding-bottom: 0; }
.line.locked .what { opacity: .55; }
.line .what { display: grid; gap: 2px; min-width: 0; }
.line .top-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.g-enh { --g: var(--enh); } .g-pedi { --g: var(--pedi); }
.grp { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
.grp i { width: 8px; height: 8px; border-radius: 50%; background: var(--g); }
.svc { font-weight: 500; }
.req { font-size: 14px; color: var(--accent); font-weight: 600; }
.status { color: var(--muted); font-size: 14px; }
.status strong { color: var(--ink); font-weight: 600; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
.btn.assign { background: var(--accent); border-color: var(--accent); color: var(--on-accent); min-width: 148px; font-weight: 600; }
.btn.assign:hover { background: var(--accent-press); border-color: var(--accent-press); }
.btn.done { min-width: 96px; }
.empty { color: var(--muted); padding: 24px; text-align: center; background: var(--soft); border-radius: var(--r-md); }

/* Turn line */
.techs { background: var(--canvas); border: 1px solid var(--hair); border-radius: var(--r-md); overflow: hidden; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); box-shadow: var(--float); }
@media (max-width: 1080px) { .techs { position: static; } }
.nextup { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 0 8px; border-bottom: 1px solid var(--hair); }
.nextup button { padding: 16px 8px 12px; text-align: center; border-bottom: 2px solid transparent; min-height: 72px; min-width: 0; color: var(--muted); }
.nextup button[aria-selected="true"] { border-bottom-color: var(--ink); color: var(--ink); }
.nextup .gname { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.nextup .gname i { width: 8px; height: 8px; border-radius: 50%; background: var(--g); }
.nextup .sub { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.upnext { padding: 16px 20px; background: var(--soft); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.upnext span { color: var(--muted); font-size: 14px; }
.upnext b { font-size: 18px; font-weight: 600; }
.tlist { max-height: calc(100vh - 290px); overflow-y: auto; }
@media (max-width: 1080px) { .tlist { max-height: none; } }
.trow { width: 100%; display: grid; grid-template-columns: 24px minmax(0, 1fr) auto 40px; gap: 12px; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--hair-soft); text-align: left; min-height: 64px; }
.trow:hover { background: var(--soft); }
.trow .pos { color: var(--muted); font-size: 14px; text-align: center; }
.trow .tn, .trow .ts { display: block; }
.trow .tn { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .ts { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trow .turns { font-size: 20px; font-weight: 600; text-align: right; }
.trow .turns small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); margin-top: -2px; }
.trow.up .pos { color: var(--ink); font-weight: 700; }
.trow.up .tn::after { content: " · next"; color: var(--accent); font-weight: 600; }
.st { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--hair); }
.st.available { color: var(--ok); font-weight: 600; } .st.available::before { background: var(--ok); }
.st.busy::before { background: var(--muted); }
.st.break { color: var(--warn); } .st.break::before { background: var(--warn); }
.st.off::before { background: transparent; border: 1px solid var(--muted); }
.rq { color: var(--ink); font-weight: 600; }
.tgroup-label { font-size: 13px; color: var(--muted); padding: 20px 20px 8px; }
.trow.offrow { color: var(--muted); }

/* Overlays */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.sheet { background: var(--canvas); color: var(--ink); border-radius: var(--r-lg); box-shadow: var(--float); width: min(560px, 100%); max-height: calc(100% - 32px); overflow-y: auto; padding: 32px; display: grid; gap: 20px; }
@media (max-width: 600px) { .sheet { padding: 24px; } }
.sheet h3 { font-size: 22px; font-weight: 600; letter-spacing: -.3px; margin: 0; text-wrap: balance; }
.sheet .sub { color: var(--muted); margin: -12px 0 0; }
.sheet .row { display: flex; flex-wrap: wrap; gap: 12px; }
.sheet .row .btn { flex: 1 1 150px; }
.sheet label { font-size: 14px; color: var(--muted); display: grid; gap: 8px; }
.sheet input[type="text"], .sheet input[type="tel"], .sheet select { min-height: 56px; border: 1px solid var(--hair); border-radius: var(--r-sm); padding: 0 14px; background: var(--canvas); color: var(--ink); font: inherit; font-size: 16px; width: 100%; }
.sheet input:focus, .sheet select:focus { outline: none; border: 2px solid var(--ink); padding: 0 13px; }
.sec { font-size: 16px; font-weight: 600; }
.call { text-align: center; padding: 24px 8px 8px; }
.call .k { font-size: 14px; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }
.call .k i { width: 10px; height: 10px; border-radius: 50%; background: var(--g); }
.call .big { font-size: clamp(48px, 10vw, 72px); font-weight: 700; letter-spacing: -1.5px; line-height: 1.1; margin: 12px 0 8px; }
.call .detail { font-size: 17px; color: var(--body); }
.pin-dots { display: flex; gap: 16px; justify-content: center; }
.pin-dots i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--muted); }
.pin-dots i.on { background: var(--ink); border-color: var(--ink); }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.pad button { min-height: 64px; font-size: 22px; font-weight: 500; border-radius: var(--r-md); background: var(--soft); }
.pad button:hover { background: var(--strong); }
.err { color: var(--crit); text-align: center; min-height: 20px; margin: 0; font-size: 14px; }
.opt { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 16px; border: 1px solid var(--hair); border-radius: var(--r-md); text-align: left; min-height: 64px; width: 100%; }
.opt:hover { border-color: var(--ink); }
.svcsec { display: grid; gap: 8px; }
.svcsec > span { font-size: 14px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.svcsec > span i { width: 8px; height: 8px; border-radius: 50%; background: var(--g); }
.gtoggle { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.gtoggle button { min-height: 76px; border-radius: var(--r-md); border: 1px solid var(--hair); padding: 12px; text-align: left; display: grid; gap: 4px; align-content: start; }
.gtoggle button b { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.gtoggle button b i { width: 8px; height: 8px; border-radius: 50%; background: var(--g); }
.gtoggle button small { font-size: 12px; color: var(--muted); }
.gtoggle button[aria-pressed="true"] { border: 2px solid var(--ink); padding: 11px; background: var(--soft); }
.gblock { border-top: 1px solid var(--hair-soft); padding-top: 16px; display: grid; gap: 12px; }
.gblock > strong { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.gblock > strong i { width: 8px; height: 8px; border-radius: 50%; background: var(--g); }
.svcchips { display: flex; flex-wrap: wrap; gap: 8px; }
.svcchips button { min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--hair); font-size: 14px; }
.svcchips button:hover { border-color: var(--ink); }
.svcchips button[aria-pressed="true"] { background: var(--ink); color: var(--canvas); border-color: var(--ink); }
.reasons button { min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--hair); font-size: 14px; }
.reasons button[aria-pressed="true"] { background: var(--ink); color: var(--canvas); border-color: var(--ink); }
.stepper { display: flex; align-items: center; justify-content: center; gap: 28px; }
.stepper b { font-size: 64px; font-weight: 700; letter-spacing: -1px; min-width: 80px; text-align: center; line-height: 1.1; }
.stepper button { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--hair); font-size: 22px; }
.stepper button:hover { border-color: var(--ink); }
.loglist, .donelist { display: grid; max-height: 60vh; overflow-y: auto; }
.logrow { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--hair-soft); font-size: 14px; color: var(--body); }
.logrow time { color: var(--muted); }
.phone { display: flex; gap: 12px; align-items: center; justify-content: space-between; border-top: 1px solid var(--hair-soft); padding-top: 16px; }
.phone span { color: var(--muted); }
.phone b { font-size: 17px; font-weight: 600; user-select: all; margin-right: auto; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--canvas); padding: 14px 20px; border-radius: var(--r-sm); font-size: 14px; z-index: 30; box-shadow: var(--float); max-width: calc(100% - 32px); }
.foot { color: var(--muted); font-size: 13px; margin-top: 40px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: rise .18s ease-out; } @keyframes rise { from { transform: translateY(8px); opacity: .5; } } }
</style>

<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true"></span><h1>Turn Desk</h1><span class="clock num" id="clock"></span></div>
  <div class="counts" id="counts"></div>
  <label class="search" for="q"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Search name, phone, or tech" autocomplete="off"></label>
  <div class="grow"></div>
  <button class="btn ghost" data-act="open-log">Activity</button>
  <button class="btn primary" data-act="open-add">+ Walk-in</button>
</header>
<div id="banner"></div>
<main class="main">
  <section aria-labelledby="cust-h">
    <div class="panel-h"><h2 id="cust-h">Customers</h2><span class="hint">In check-in order</span></div>
    <div class="list" id="list"></div>
  </section>
  <aside aria-labelledby="tech-h">
    <div class="panel-h"><h2 id="tech-h">Turn line</h2><span class="hint">Fewest turns first · tap a name</span></div>
    <div class="techs" id="techs"></div>
  </aside>
</main>
<p class="foot">Prototype with sample data for usability testing. Demo PIN for every technician: 1234. <button class="btn small" data-act="kiosk">Simulate kiosk check-in</button><button class="btn small" data-act="reset">Reset demo</button></p>
<div id="overlay"></div>
<div id="toast"></div>

<script>
(() => {
const MIN = 60000;
const GROUPS = {
  pedi: { label: "Pedi & Mani", hint: "Pedicure and natural nails", services: ["Pedicure", "Gel pedicure", "Deluxe spa pedicure", "Manicure", "Gel manicure", "Dip powder", "Polish change"] },
  enh:  { label: "Enhancements", hint: "Acrylic, tips, hard gel", services: ["Acrylic full set", "Acrylic fill", "Gel-X tips", "Hard gel full set", "Hard gel fill"] }
};
// Which team does each service go to. Natural nails go to the pedi team; anything with extensions goes to enhancements.
const MENU = [
  { title: "Feet", group: "pedi", services: ["Pedicure", "Gel pedicure", "Deluxe spa pedicure"] },
  { title: "Hands · natural nails", group: "pedi", services: ["Manicure", "Gel manicure", "Dip powder", "Polish change"] },
  { title: "Hands · extensions (acrylic, tips, hard gel)", group: "enh", services: ["Acrylic full set", "Acrylic fill", "Gel-X tips", "Hard gel full set", "Hard gel fill"] }
];
const groupOf = svc => MENU.find(c => c.services.includes(svc)).group;
const GKEYS = Object.keys(GROUPS);
const TECH_NAMES = {
  pedi: ["Mai","Hạnh","Loan","Quyên","Cindy","Lily","Vicky","Hoa","Bảo","Khoa","Nga","Oanh","Phúc","Quế","Sương","Tiên","Uyên","Vân","Xuân","Hiếu","Tú","Jade","Ruby","Kiều","Đào","Thảo","Yến","Trang"],
  enh:  ["Linh","Tuấn","Kelly","Tina","Vy","Ngọc","Jenny","Amy","Trâm","Kim","Lan","Thu","Hằng","Phương","Nhi","Tâm","Long","Danny","Tony","Hương","Diễm","My"]
};
const CUST = ["Anna K.","Brianna L.","Chloe M.","Danielle R.","Emily S.","Fatima A.","Grace W.","Hannah P.","Isabel G.","Jasmine T.","Karen O.","Lauren B.","Maria C.","Nicole D.","Olivia F.","Priya N.","Rachel H.","Sophia V.","Tiffany J.","Vanessa Q.","Whitney E.","Yasmin Z.","Zoe I.","Ashley U.","Brittany Y.","Carmen X.","Diana K.","Erica L.","Gabriela M.","Jessica R.","Kayla S.","Lucia A.","Megan W.","Natalie P.","Paige G.","Rosa T.","Sarah O.","Taylor B.","Valerie C.","Alyssa D."];

let S, uid = 1;
const nid = p => p + (uid++);
const now = () => Date.now();
const fmt = t => new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const mins = t => Math.max(0, Math.round((now() - t) / MIN));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];
const phone = () => "(718) 555-0" + String(100 + Math.floor(Math.random() * 900)).slice(0, 3);

function seed() {
  uid = 1;
  const N = now();
  const techs = [];
  const onDutyCount = { pedi: 23, enh: 18 };
  GKEYS.forEach(g => TECH_NAMES[g].forEach((name, i) => {
    const on = i < onDutyCount[g];
    techs.push({ id: nid("t"), name, group: g, phone: phone(), pin: "1234",
      checkinAt: on ? N - (300 - i * 6) * MIN : null, status: on ? "available" : "off",
      turns: on ? 2 + ((i * 7) % 4) : 0, reqs: on ? (i % 3 === 0 ? 1 : 0) : 0, freeSince: N - (i % 9) * MIN });
  }));
  const T = n => techs.find(t => t.name === n);
  const visits = [];
  const usedNames = new Set();
  const cname = () => { let n; do { n = pick(CUST); } while (usedNames.has(n) && usedNames.size < CUST.length); usedNames.add(n); return n; };
  const PEDI_FEET = ["Pedicure", "Gel pedicure", "Deluxe spa pedicure"];
  const mkVisit = (checkinAgo, lines) => {
    const v = { id: nid("v"), name: cname(), phone: phone(), checkinAt: N - checkinAgo * MIN, lines: [], doneAt: null };
    lines.forEach(l => v.lines.push(Object.assign({ id: nid("l"), service: pick(GROUPS[l.group].services), reqTech: null, status: "waiting", tech: null, startedAt: null, doneAt: null }, l)));
    visits.push(v); return v;
  };
  const busy = (t, startedAgo) => { t.status = "busy"; return { tech: t.id, status: "in", startedAt: N - startedAgo * MIN }; };
  const inEnh = techs.filter(t => t.group === "enh" && t.status === "available").slice(0, 12);
  const inPedi = techs.filter(t => t.group === "pedi" && t.status === "available").slice(0, 15);
  const spare = () => techs.find(x => x.group === "pedi" && x.status === "available" && !inPedi.includes(x));
  inEnh.forEach((t, i) => {
    const ago = 6 + (i * 5) % 40;
    if (i === 3 || i === 7) {
      // Part 1 pedicure done, part 2 extensions in service (P2)
      const ft = spare();
      mkVisit(ago + 50, [
        { group: "pedi", service: pick(PEDI_FEET), status: "done", tech: ft ? ft.id : null, startedAt: N - (ago + 45) * MIN, doneAt: N - (ago + 4) * MIN },
        Object.assign({ group: "enh" }, busy(t, ago))
      ]);
    } else {
      mkVisit(ago + 3 + (i % 4), [Object.assign({ group: "enh" }, busy(t, ago), i === 0 ? { reqTech: t.id } : {})]);
    }
  });
  inPedi.forEach((t, i) => {
    const ago = 4 + (i * 7) % 38;
    const svc = i % 4 === 1 ? "Pedicure + Gel manicure" : i % 4 === 2 ? pick(["Manicure", "Gel manicure", "Dip powder"]) : pick(PEDI_FEET);
    const lines = [Object.assign({ group: "pedi", service: svc }, busy(t, ago))];
    if (i === 0 || i === 4 || i === 8) lines.push({ group: "enh", service: "Gel-X tips" }); // part 2 locked until pedicure is done
    mkVisit(ago + 2 + (i % 3), lines);
  });
  // Waiting
  const linh = T("Linh"); // busy (first enhancements tech)
  const freePedi = techs.filter(t => t.group === "pedi" && t.status === "available");
  mkVisit(22, [{ group: "enh", service: "Acrylic full set", reqTech: linh.id }]);
  mkVisit(14, [{ group: "enh", service: "Acrylic fill" }]);
  mkVisit(9, [{ group: "pedi", service: "Deluxe spa pedicure" }]);
  mkVisit(7, [{ group: "pedi", service: "Pedicure" }, { group: "enh", service: "Hard gel full set" }]);
  mkVisit(6, [{ group: "pedi", service: "Pedicure + Gel manicure" }]);
  mkVisit(5, [{ group: "enh", service: "Gel-X tips", reqTech: linh.id }]);
  mkVisit(4, [{ group: "pedi", service: "Gel manicure" }]);
  mkVisit(3, [{ group: "pedi", service: "Gel pedicure", reqTech: freePedi[2] ? freePedi[2].id : null }]);
  const between = mkVisit(48, [{ group: "pedi", status: "done", tech: freePedi[0].id, startedAt: N - 44 * MIN, doneAt: N - 3 * MIN }, { group: "enh" }]);
  between.lines[0].service = "Deluxe spa pedicure"; between.lines[1].service = "Gel-X tips";
  mkVisit(1, [{ group: "enh", service: "Hard gel fill" }]);
  const done = [];
  for (let i = 0; i < 118; i++) done.push({ id: nid("d"), name: pick(CUST), at: N - (20 + i * 2) * MIN, groups: [pick(GKEYS)] });
  return { techs, visits, done, log: [{ t: N - 300 * MIN, text: "Day started. Turn counts reset to 0." }], ui: { tab: "pedi", q: "", modal: null, banner: null, call: null } };
}

function load() { try { const raw = localStorage.getItem("turn-desk-v2"); if (raw) { const s = JSON.parse(raw); uid = s._uid || 1000; return s; } } catch (e) {} return seed(); }
function save() { try { S._uid = uid; localStorage.setItem("turn-desk-v2", JSON.stringify(S)); } catch (e) {} }

const tech = id => S.techs.find(t => t.id === id);
const lineOf = id => { for (const v of S.visits) for (const l of v.lines) if (l.id === id) return [v, l]; return [null, null]; };
const activeVisits = () => S.visits.filter(v => !v.doneAt);
const isLocked = (v, l) => l.status === "waiting" && v.lines.some(x => x !== l && x.status === "in");
const byLine = (a, b) => a.turns - b.turns || a.checkinAt - b.checkinAt;
function onDuty(g) { return S.techs.filter(t => t.group === g && t.status !== "off").sort(byLine); }
function waitingReqFor(techId) {
  const out = [];
  activeVisits().slice().sort((a, b) => a.checkinAt - b.checkinAt).forEach(v => v.lines.forEach(l => { if (l.status === "waiting" && l.reqTech === techId) out.push([v, l]); }));
  return out;
}
function waitedSince(v, l) {
  const prev = v.lines.filter(x => x.status === "done" && x.doneAt).map(x => x.doneAt);
  return prev.length ? Math.max(...prev) : v.checkinAt;
}

// Suggestions: requests first (M3), then fewest turns / earliest check-in, oldest customer first.
function suggestions() {
  const sug = new Map(), reserved = new Set(), visitHas = new Set();
  const lines = [];
  activeVisits().forEach(v => v.lines.forEach(l => { if (l.status === "waiting" && !isLocked(v, l)) lines.push([v, l]); }));
  lines.sort((a, b) => waitedSince(...a) - waitedSince(...b));
  for (const [v, l] of lines) {
    if (!l.reqTech) continue;
    const t = tech(l.reqTech);
    if (t && t.status === "available" && !reserved.has(t.id)) { sug.set(l.id, t.id); reserved.add(t.id); visitHas.add(v.id); }
  }
  for (const [v, l] of lines) {
    if (l.reqTech) continue;
    const t = onDuty(l.group).find(t => t.status === "available" && !reserved.has(t.id) && !waitingReqFor(t.id).length);
    if (t) { sug.set(l.id, t.id); reserved.add(t.id); visitHas.add(v.id); }
  }
  return sug;
}

function addLog(text) { S.log.unshift({ t: now(), text }); }
function toast(msg) {
  const el = document.getElementById("toast");
  el.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast._t); toast._t = setTimeout(() => { el.innerHTML = ""; }, 2600);
}

function assign(lineId, techId, how) {
  const [v, l] = lineOf(lineId); const t = tech(techId);
  if (!v || !t) return;
  if (t.status !== "available") { toast(`${t.name} is no longer free. Pick the next technician.`); render(); return; }
  if (isLocked(v, l)) { toast(`${v.name} is still in another service.`); return; }
  const isReq = l.reqTech === t.id;
  l.status = "in"; l.tech = t.id; l.startedAt = now();
  t.status = "busy";
  if (isReq) t.reqs++; else t.turns++;
  addLog(`${t.name} → ${v.name} (${GROUPS[l.group].label}: ${l.service}). ${isReq ? "Request, no turn." : "+1 turn (now " + t.turns + ")."}${how === "override" ? " Picked manually by manager." : ""}`);
  S.ui.call = { tech: t.name, group: l.group, customer: v.name, service: l.service, req: isReq };
  save(); render();
}
function finish(lineId) {
  const [v, l] = lineOf(lineId); const t = tech(l.tech);
  l.status = "done"; l.doneAt = now();
  if (t && t.status === "busy") { t.status = "available"; t.freeSince = now(); }
  const left = v.lines.filter(x => x.status !== "done");
  if (!left.length) {
    v.doneAt = now();
    S.done.unshift({ id: v.id, name: v.name, at: v.doneAt, groups: v.lines.map(x => x.group) });
    addLog(`${t ? t.name : "Tech"} finished ${v.name}. Visit closed; ${v.name} goes to checkout.`);
    toast(`${v.name} is done. ${t ? t.name + " is free." : ""}`);
  } else {
    addLog(`${t ? t.name : "Tech"} finished ${GROUPS[l.group].label} for ${v.name}. ${GROUPS[left[0].group].label} part moves to the front.`);
    toast(`${t ? t.name + " is free. " : ""}${v.name} now waits for ${GROUPS[left[0].group].label}.`);
  }
  save(); render();
}
function techAction(t, action) {
  if (action === "checkin") {
    t.status = "available"; t.checkinAt = now(); t.freeSince = now();
    addLog(`${t.name} checked in (${GROUPS[t.group].label}).`);
    const others = onDuty(t.group).filter(x => x.id !== t.id);
    const avg = others.length ? others.reduce((s, x) => s + x.turns, 0) / others.length : 0;
    if (avg >= 2 && t.turns === 0) S.ui.banner = { techId: t.id, avg: Math.floor(avg) };
  } else if (action === "break") { t.status = "break"; addLog(`${t.name} started a break. Turns kept at ${t.turns}.`); }
  else if (action === "back") { t.status = "available"; t.freeSince = now(); addLog(`${t.name} is back from break.`); }
  else if (action === "checkout") { t.status = "off"; addLog(`${t.name} checked out with ${t.turns} turns.`); }
  toast(`${t.name}: ${{ checkin: "checked in", break: "on break", back: "back in line", checkout: "checked out" }[action]}`);
  save(); render();
}
function adjust(t, to, reason) {
  const from = t.turns; t.turns = to;
  addLog(`Manager set ${t.name} from ${from} to ${to} turns. Reason: ${reason}.`);
  if (S.ui.banner && S.ui.banner.techId === t.id) S.ui.banner = null;
  toast(`${t.name} now has ${to} turns.`);
  save(); render();
}
function addVisit(name, ph, picks, source) {
  const v = { id: nid("v"), name, phone: ph, checkinAt: now(), lines: [], doneAt: null };
  picks.forEach(p => v.lines.push({ id: nid("l"), group: p.group, service: p.service || GROUPS[p.group].services[0], reqTech: p.reqTech || null, status: "waiting", tech: null, startedAt: null, doneAt: null }));
  S.visits.push(v);
  addLog(`${name} checked in at the ${source}: ${v.lines.map(l => GROUPS[l.group].label + (l.reqTech ? " (requests " + tech(l.reqTech).name + ")" : "")).join(" + ")}.`);
  toast(`${name} added to the waiting list.`);
  save(); render();
}

// ---------- Render ----------
function waitPill(m) {
  const cls = m >= 20 ? "crit" : m >= 10 ? "warn" : "";
  return `<span class="wait ${cls} num">Waiting ${m} min</span>`;
}
function matchQ(v) {
  const q = S.ui.q.trim().toLowerCase();
  if (!q) return true;
  if (v.name.toLowerCase().includes(q) || v.phone.replace(/\D/g, "").endsWith(q.replace(/\D/g, "") || "~")) return true;
  return v.lines.some(l => [l.tech, l.reqTech].some(id => id && tech(id).name.toLowerCase().includes(q)));
}
function lineHTML(v, l, sug) {
  const g = GROUPS[l.group];
  const rq = l.reqTech ? `<span class="req">Requests ${esc(tech(l.reqTech).name)}</span>` : "";
  let status = "", acts = "";
  if (l.status === "done") {
    status = `<span class="status">✓ Done by <strong>${esc(l.tech ? tech(l.tech).name : "—")}</strong></span>`;
  } else if (l.status === "in") {
    const t = tech(l.tech);
    status = `<span class="status"><strong>${esc(t.name)}</strong> · <span class="num">${mins(l.startedAt)} min</span></span>`;
    acts = `<button class="btn done" data-act="finish" data-line="${l.id}">Done</button>`;
  } else if (isLocked(v, l)) {
    const cur = v.lines.find(x => x.status === "in");
    status = `<span class="status">After ${esc(GROUPS[cur.group].label.toLowerCase())} is done</span>`;
  } else if (sug.has(l.id)) {
    const t = tech(sug.get(l.id));
    const multi = v.lines.filter(x => x.status === "waiting").length > 1;
    status = `<span class="status">${l.reqTech ? "Requested tech is free" : "Up next · " + t.turns + " turns"}${multi ? " · start either part" : ""}</span>`;
    acts = `<button class="btn assign" data-act="assign" data-line="${l.id}" data-tech="${t.id}">Assign ${esc(t.name)}</button>` +
      (l.reqTech ? "" : `<button class="btn small" data-act="open-override" data-line="${l.id}" aria-label="Pick another technician">Other</button>`);
  } else if (l.reqTech) {
    const t = tech(l.reqTech);
    const q = waitingReqFor(t.id); const pos = q.findIndex(([, x]) => x.id === l.id) + 1;
    const state = t.status === "busy" ? "is busy" : t.status === "break" ? "is on break" : t.status === "off" ? "is not checked in" : "is taking an earlier request";
    status = `<span class="status">${esc(t.name)} ${state} · <strong>#${pos}</strong> in ${esc(t.name)}'s requests</span>`;
    acts = `<button class="btn small" data-act="to-anyone" data-line="${l.id}">Switch to anyone</button>`;
  } else {
    const free = onDuty(l.group).filter(t => t.status === "available").length;
    status = `<span class="status">${free ? "Free techs are reserved for earlier customers" : "No " + esc(g.label.toLowerCase()) + " tech free yet"}</span>`;
    acts = `<button class="btn small" data-act="open-override" data-line="${l.id}">Pick tech</button>`;
  }
  return `<div class="line g-${l.group} ${isLocked(v, l) ? "locked" : ""}">
    <div class="what"><div class="top-row"><span class="grp"><i></i>${g.label}</span><span class="svc">${esc(l.service)}</span>${rq}</div>${status}</div>
    <div class="acts">${acts}</div></div>`;
}
function cardHTML(v, sug) {
  const waiting = !v.lines.some(l => l.status === "in");
  const wl = v.lines.find(l => l.status === "waiting" && !isLocked(v, l));
  const m = wl ? mins(waitedSince(v, wl)) : 0;
  const between = v.lines.some(l => l.status === "done");
  return `<article class="card ${waiting ? "" : "busy"}">
    <div class="card-h"><span class="name">${esc(v.name)}</span><span class="meta num">in ${fmt(v.checkinAt)} · …${esc(v.phone.slice(-4))}</span>
    ${waiting && between ? `<span class="note">Part 2</span>` : ""}${waiting ? waitPill(m) : `<span class="wait">In service</span>`}</div>
    <div class="lines">${v.lines.map(l => lineHTML(v, l, sug)).join("")}</div></article>`;
}
const reqLines = v => v.lines.filter(l => l.reqTech && l.status !== "done");
function renderList(sug) {
  const all = activeVisits().filter(matchQ).sort((a, b) => a.checkinAt - b.checkinAt);
  const isWaiting = v => !v.lines.some(l => l.status === "in");
  const withReq = all.filter(v => reqLines(v).length);
  const f = S.ui.filter || "all";
  const chip = (k, label, n) => `<button aria-pressed="${f === k}" data-act="filter" data-f="${k}">${label} <span class="num">${n}</span></button>`;
  let h = `<div class="filters svcchips">${chip("all", "All", all.length)}${chip("waiting", "Waiting", all.filter(isWaiting).length)}${chip("requests", "Requests", withReq.length)}</div>`;
  if (f === "requests") {
    // Group by requested technician so the desk sees who is waiting for whom.
    const byTech = new Map();
    withReq.forEach(v => reqLines(v).forEach(l => { if (!byTech.has(l.reqTech)) byTech.set(l.reqTech, []); if (!byTech.get(l.reqTech).includes(v)) byTech.get(l.reqTech).push(v); }));
    if (!byTech.size) h += `<div class="empty">No request customers right now.</div>`;
    [...byTech.entries()].sort((a, b) => b[1].length - a[1].length).forEach(([id, vs]) => {
      const t = tech(id);
      const w = vs.filter(v => v.lines.some(l => l.reqTech === id && l.status === "waiting")).length;
      h += `<div class="section-label">${esc(t.name)} <span>${GROUPS[t.group].label} · ${w} waiting · ${t.status === "busy" ? "busy now" : t.status === "available" ? "free now" : t.status === "break" ? "on break" : "not in"}</span></div>`;
      h += vs.map(v => cardHTML(v, sug)).join("");
    });
  } else {
    const list = f === "waiting" ? all.filter(isWaiting) : all;
    h += list.length ? list.map(v => cardHTML(v, sug)).join("") : `<div class="empty">No customers${S.ui.q ? " for this search" : ""}.</div>`;
  }
  document.getElementById("list").innerHTML = h;
}
function techStatus(t) {
  if (t.status === "busy") {
    const v = activeVisits().find(v => v.lines.some(l => l.tech === t.id && l.status === "in"));
    const l = v && v.lines.find(l => l.tech === t.id && l.status === "in");
    return `<span class="st busy">With ${esc(v ? v.name.split(" ")[0] : "client")} · ${l ? mins(l.startedAt) : 0}m</span>`;
  }
  return `<span class="st ${t.status}">${{ available: "Free", break: "Break", off: "Not in" }[t.status]}</span>`;
}
function renderTechs(sug) {
  const tab = S.ui.tab;
  const next = g => onDuty(g).find(t => t.status === "available" && !waitingReqFor(t.id).length);
  let h = `<div class="nextup" role="tablist">` + GKEYS.map(g => {
    const on = onDuty(g);
    return `<button class="g-${g}" role="tab" aria-selected="${g === tab}" data-act="tab" data-g="${g}">
      <span class="gname"><i></i>${GROUPS[g].label}</span>
      <span class="sub num">${on.filter(t => t.status === "available").length} free of ${on.length}</span></button>`;
  }).join("") + `</div>`;
  const nx = next(tab);
  h += `<div class="upnext"><span>Next up for ${GROUPS[tab].label.toLowerCase()}</span><b>${nx ? esc(nx.name) : "No one free"}</b></div><div class="tlist g-${tab}">`;
  onDuty(tab).forEach((t, i) => {
    const rq = waitingReqFor(t.id).length;
    h += `<button class="trow ${nx && nx.id === t.id ? "up" : ""}" data-act="open-tech" data-tech="${t.id}">
      <span class="pos num">${i + 1}</span>
      <span style="min-width:0"><span class="tn">${esc(t.name)}</span><span class="ts">${rq ? `<span class="rq">${rq} waiting</span>` : t.reqs ? t.reqs + " request" + (t.reqs > 1 ? "s" : "") + " today" : "in " + fmt(t.checkinAt)}</span></span>
      ${techStatus(t)}
      <span class="turns num">${t.turns}<small>turns</small></span></button>`;
  });
  const off = S.techs.filter(t => t.group === tab && t.status === "off");
  if (off.length) {
    h += `<div class="tgroup-label">Not checked in · ${off.length}</div>`;
    off.forEach(t => { h += `<button class="trow offrow" data-act="open-tech" data-tech="${t.id}"><span class="pos">–</span><span class="tn">${esc(t.name)}</span>${techStatus(t)}<span class="turns num">${t.turns}<small>turns</small></span></button>`; });
  }
  document.getElementById("techs").innerHTML = h + `</div>`;
}
function renderCounts() {
  const act = activeVisits();
  const w = act.filter(v => !v.lines.some(l => l.status === "in")).length;
  const i = act.length - w;
  document.getElementById("counts").innerHTML =
    `<span class="count"><b class="num">${w}</b>waiting</span>` +
    `<span class="count"><b class="num">${i}</b>in service</span>` +
    `<button class="count" data-act="open-done"><b class="num">${S.done.length}</b>done today</button>`;
  document.getElementById("clock").textContent = fmt(now());
}
function renderBanner() {
  const b = S.ui.banner, el = document.getElementById("banner");
  if (!b) { el.innerHTML = ""; return; }
  const t = tech(b.techId);
  el.innerHTML = `<div class="banner" role="alert"><p><strong>${esc(t.name)}</strong> checked in at ${fmt(t.checkinAt)} with 0 turns. ${GROUPS[t.group].label} average is ${b.avg}. With 0 turns, ${esc(t.name)} goes to the top of the line.</p>
    <button class="btn" data-act="banner-set" data-n="${b.avg}">Set to ${b.avg} turns</button>
    <button class="btn" data-act="open-adjust" data-tech="${t.id}">Adjust…</button>

}

// ---------- Modals ----------
function modal(html, groupCls = "") {
  document.getElementById("overlay").innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet ${groupCls}" role="dialog" aria-modal="true">${html}</div></div>`;
  const f = document.querySelector(".sheet [autofocus]"); if (f) f.focus();
}
function closeModal() { S.ui.modal = null; S.ui.call = null; document.getElementById("overlay").innerHTML = ""; }
function renderModal() {

      <div class="sec">Manager</div><div class="row"><button class="btn" data-act="open-adjust" data-tech="${t.id}">Adjust turns</button></div>
      <div class="phone"><span>Phone</span><b class="num">${esc(t.phone)}</b><button class="btn small" data-act="copy" data-text="${esc(t.phone)}">Copy</button></div>
      <button class="btn ghost" data-act="close">Close</button>`);
  }
  if (m.type === "pin") {
    const t = tech(m.techId);
    const label = { checkin: "Check in", break: "Start break", back: "Back from break", checkout: "Check out" }[m.do];
    return modal(`<h3>${esc(t.name)}: ${label}</h3><p class="sub">Enter your 4-digit PIN</p>
      <div class="pin-dots" aria-label="${m.pin.length} of 4 digits">${[0,1,2,3].map(i => `<i class="${i < m.pin.length ? "on" : ""}"></i>`).join("")}</div>
      <p class="err">${m.err || ""}</p>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-act="key" data-k="${n}">${n}</button>`).join("")}<button data-act="close" style="font-size:15px">Cancel</button><button data-act="key" data-k="0">0</button><button data-act="key" data-k="del" aria-label="Delete">⌫</button></div>`);
  }
  if (m.type === "adjust") {
    const t = tech(m.techId);
    const reasons = ["Late check-in", "Missed turn", "Assigned by mistake", "Other"];
    return modal(`<h3>Adjust turns · ${esc(t.name)}</h3><p class="sub">Every change is saved in Activity with your reason.</p>
      <div class="stepper"><button data-act="step" data-d="-1" aria-label="One less">−</button><b class="num">${m.to}</b><button data-act="step" data-d="1" aria-label="One more">+</button></div>
      <div class="sec">Reason</div><div class="svcchips reasons">${reasons.map(r => `<button aria-pressed="${m.reason === r}" data-act="reason" data-r="${r}">${r}</button>`).join("")}</div>
      ${m.reason === "Other" ? `<label for="why">Describe the reason<input id="why" type="text" value="${esc(m.note || "")}" placeholder="e.g. Gave her turn to Hoa"></label>` : ""}
      <div class="row"><button class="btn ghost" data-act="close">Cancel</button><button class="btn primary" data-act="save-adjust" ${!m.reason || m.to === t.turns ? "disabled" : ""}>Save ${m.to} turns</button></div>`);
  }
  if (m.type === "override") {
    const [v, l] = lineOf(m.lineId);
    const opts = onDuty(l.group).filter(t => t.status === "available");
    return modal(`<h3>Pick a technician</h3><p class="sub">${esc(v.name)} · ${GROUPS[l.group].label}: ${esc(l.service)}. Picking out of order is noted in Activity.</p>
      <div class="list g-${l.group}">${opts.length ? opts.map((t, i) => `<button class="opt" data-act="assign" data-override="1" data-line="${l.id}" data-tech="${t.id}"><span><strong>${esc(t.name)}</strong> <span class="status">· ${i === 0 ? "first in line" : "#" + (i + 1) + " in line"}${waitingReqFor(t.id).length ? " · has a request waiting" : ""}</span></span><span class="num">${t.turns} turns</span></button>`).join("") : `<div class="empty">No free ${esc(GROUPS[l.group].label.toLowerCase())} technician right now.</div>`}</div>
      <button class="btn ghost" data-act="close">Cancel</button>`);
  }
  if (m.type === "add") {
    const teams = GKEYS.filter(g => m.services.some(x => groupOf(x) === g));
    const menu = MENU.map(c => `<div class="svcsec g-${c.group}"><span><i></i>${esc(c.title)} → ${GROUPS[c.group].label}</span>
      <div class="svcchips">${c.services.map(x => `<button type="button" aria-pressed="${m.services.includes(x)}" data-act="svc" data-s="${esc(x)}">${esc(x)}</button>`).join("")}</div></div>`).join("");
    const blocks = teams.map(g => {
      const sel = m.sel[g] || {};
      return `<div class="gblock g-${g}"><strong><i></i>${GROUPS[g].label}: ${esc(m.services.filter(x => groupOf(x) === g).join(" + "))}</strong>
        <label for="rq-${g}">Request a technician (optional)
        <select id="rq-${g}" data-act-change="req" data-g="${g}"><option value="">Anyone · fastest</option>${onDuty(g).map(t => {
          const q = waitingReqFor(t.id).length;
          const st = t.status === "available" && !q ? "free now" : t.status === "busy" ? "busy" : t.status === "break" ? "on break" : "free";
          return `<option value="${t.id}" ${sel.reqTech === t.id ? "selected" : ""}>${esc(t.name)} — ${st}${q ? ` · ${q} waiting` : ""}</option>`;
        }).join("")}</select></label></div>`;
    }).join("");
    return modal(`<h3>New walk-in</h3>
      <form id="addform" style="display:grid;gap:20px">
      <div class="row"><label for="cn" style="flex:1 1 180px">Name<input id="cn" type="text" value="${esc(m.name)}" autocomplete="off" autofocus></label>
      <label for="cp" style="flex:1 1 160px">Phone<input id="cp" type="tel" value="${esc(m.phone)}" autocomplete="off"></label></div>
      <div class="sec">Services</div>
      ${menu}
      ${blocks}
      <p class="err">${m.err || ""}</p>
      <div class="row"><button type="button" class="btn ghost" data-act="close">Cancel</button><button type="submit" class="btn primary">Add to waiting list</button></div></form>`);
  }
  if (m.type === "done") {
    return modal(`<h3>Done today · ${S.done.length}</h3>
      <div class="donelist">${S.done.slice(0, 200).map(d => `<div class="logrow"><time class="num">${fmt(d.at)}</time><span>${esc(d.name)} · ${d.groups.map(g => GROUPS[g].label).join(" + ")}</span></div>`).join("")}</div>
      <button class="btn ghost" data-act="close">Close</button>`);
  }
  if (m.type === "log") {
    return modal(`<h3>Activity</h3><p class="sub">Every assignment, turn change and status change, newest first.</p>
      <div class="loglist">${S.log.slice(0, 200).map(e => `<div class="logrow"><time class="num">${fmt(e.t)}</time><span>${esc(e.text)}</span></div>`).join("")}</div>
      <button class="btn ghost" data-act="close">Close</button>`);
  }
}

function render() {
  const sug = suggestions();
  renderCounts(); renderBanner(); renderList(sug); renderTechs(sug); renderModal();
}

// ---------- Events ----------
function readAddForm() { const m = S.ui.modal; if (m && m.type === "add") { const n = document.getElementById("cn"), p = document.getElementById("cp"); if (n) m.name = n.value; if (p) m.phone = p.value; } }
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, m = S.ui.modal;
  if (a === "scrim") { if (e.target === el) { closeModal(); render(); } return; }
  if (a === "close") { closeModal(); render(); return; }
  if (a === "assign") { S.ui.modal = null; assign(el.dataset.line, el.dataset.tech, el.dataset.override ? "override" : "suggested"); return; }
  if (a === "finish") { finish(el.dataset.line); return; }
  if (a === "to-anyone") { const [v, l] = lineOf(el.dataset.line); addLog(`${v.name} switched from ${tech(l.reqTech).name} to anyone.`); l.reqTech = null; save(); render(); return; }
  if (a === "open-override") { S.ui.modal = { type: "override", lineId: el.dataset.line }; render(); return; }
  if (a === "filter") { S.ui.filter = el.dataset.f; save(); render(); return; }
  if (a === "tab") { S.ui.tab = el.dataset.g; save(); render(); return; }
  if (a === "open-tech") { S.ui.modal = { type: "tech", techId: el.dataset.tech }; render(); return; }
  if (a === "pin") { S.ui.modal = { type: "pin", techId: m.techId, do: el.dataset.do, pin: "" }; render(); return; }
  if (a === "key") {
    if (el.dataset.k === "del") m.pin = m.pin.slice(0, -1); else if (m.pin.length < 4) m.pin += el.dataset.k;
    m.err = "";
    if (m.pin.length === 4) {
      const t = tech(m.techId);
      if (m.pin === t.pin) { const d = m.do; S.ui.modal = null; techAction(t, d); return; }
      m.pin = ""; m.err = "Wrong PIN. Try again.";
    }
    render(); return;
  }
  if (a === "open-adjust") { const t = tech(el.dataset.tech); S.ui.modal = { type: "adjust", techId: t.id, to: S.ui.banner && S.ui.banner.techId === t.id ? S.ui.banner.avg : t.turns, reason: S.ui.banner && S.ui.banner.techId === t.id ? "Late check-in" : "" }; render(); return; }
  if (a === "step") { m.to = Math.max(0, m.to + Number(el.dataset.d)); render(); return; }
  if (a === "reason") { const w = document.getElementById("why"); if (w) m.note = w.value; m.reason = el.dataset.r; render(); return; }
  if (a === "save-adjust") {
    const w = document.getElementById("why"); const note = w ? w.value.trim() : "";
    if (m.reason === "Other" && !note) { toast("Write a short reason first."); return; }
    const t = tech(m.techId); S.ui.modal = null; adjust(t, m.to, m.reason === "Other" ? note : m.reason); return;
  }
  if (a === "banner-set") { const t = tech(S.ui.banner.techId); adjust(t, Number(el.dataset.n), "Late check-in"); return; }
  if (a === "banner-keep") { addLog(`Manager kept ${tech(S.ui.banner.techId).name} at 0 turns after late check-in.`); S.ui.banner = null; save(); render(); return; }
  if (a === "open-add") { S.ui.modal = { type: "add", name: "", phone: "", services: [], sel: {} }; render(); return; }
  if (a === "svc") {
    readAddForm(); const x = el.dataset.s; m.err = "";
    if (m.services.includes(x)) m.services = m.services.filter(y => y !== x);
    else {
      // Natural nails and extensions don't go together: picking one replaces the other.
      const cat = MENU.find(c => c.services.includes(x));
      const hands = MENU.filter(c => c.title.startsWith("Hands"));
      if (hands.includes(cat)) { const other = hands.find(c => c !== cat); m.services = m.services.filter(y => !other.services.includes(y)); }
      m.services = m.services.concat(x);
    }
    render(); return;
  }
  if (a === "open-done") { S.ui.modal = { type: "done" }; render(); return; }
  if (a === "open-log") { S.ui.modal = { type: "log" }; render(); return; }
  if (a === "copy") { const txt = el.dataset.text; try { navigator.clipboard.writeText(txt).then(() => toast("Phone number copied"), () => toast(txt)); } catch (err) { toast(txt); } return; }
  if (a === "kiosk") {
    const used = new Set(activeVisits().map(v => v.name));
    const name = CUST.find(n => !used.has(n)) || pick(CUST);
    const r = Math.random();
    const picks = r < .4 ? [{ group: "pedi" }] : r < .8 ? [{ group: "enh" }] : [{ group: "pedi", service: "Pedicure" }, { group: "enh" }];
    if (Math.random() < .25) { const t = pick(onDuty(picks[0].group)); if (t) picks[0].reqTech = t.id; }
    picks.forEach(p => { if (!p.service) p.service = pick(GROUPS[p.group].services); });
    addVisit(name, phone(), picks, "kiosk"); return;
  }
  if (a === "reset") { S = seed(); save(); render(); toast("Demo data reset."); return; }
});
document.addEventListener("change", e => {
  const el = e.target; if (el.dataset.actChange !== "req") return;
  readAddForm(); const m = S.ui.modal, g = el.dataset.g; m.sel[g] = m.sel[g] || {}; m.sel[g].reqTech = el.value || null;
});
document.addEventListener("submit", e => {
  if (e.target.id !== "addform") return;
  e.preventDefault(); readAddForm();
  const m = S.ui.modal;
  if (!m.name.trim()) { m.err = "Add the customer's name."; render(); return; }
  if (!m.services.length) { m.err = "Pick at least one service."; render(); return; }
  const picks = GKEYS.filter(g => m.services.some(x => groupOf(x) === g)).map(g => ({ group: g, service: m.services.filter(x => groupOf(x) === g).join(" + "), reqTech: (m.sel[g] || {}).reqTech }));
  S.ui.modal = null; addVisit(m.name.trim(), m.phone.trim() || "—", picks, "front desk");
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && (S.ui.modal || S.ui.call)) { closeModal(); render(); } });
document.getElementById("q").addEventListener("input", e => { S.ui.q = e.target.value; render(); });

S = load();
S.ui.q = ""; S.ui.modal = null; S.ui.call = null;
render();
setInterval(() => { if (!S.ui.modal && !S.ui.call) render(); else renderCounts(); }, 30000);
})();
</script>
